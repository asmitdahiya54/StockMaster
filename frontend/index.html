<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockMaster | Inventory Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="loginRequired" class="d-none"></div>

<div class="app-wrapper">

    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <div class="brand-icon"><i class="bi bi-box-seam"></i></div>
            <div>
                <h4>StockMaster</h4>
                <small>Inventory System</small>
            </div>
        </div>

        <div class="menu-label">MAIN MENU</div>

        <nav class="sidebar-nav">

            <a href="#" class="nav-link active" data-page="dashboard">
                <i class="bi bi-grid-1x2"></i> Dashboard
            </a>

            <div class="menu-label">INVENTORY</div>

            <a href="#" class="nav-link" data-page="products">
                <i class="bi bi-box"></i> Products
            </a>

            <a href="#" class="nav-link" data-page="categories">
                <i class="bi bi-tags"></i> Categories
            </a>

            <a href="#" class="nav-link" data-page="inventory">
                <i class="bi bi-archive"></i> Inventory
            </a>

            <a href="#" class="nav-link" data-page="warehouses">
                <i class="bi bi-building"></i> Warehouses
            </a>

            <div class="menu-label">OPERATIONS</div>

            <a href="#" class="nav-link" data-page="suppliers">
                <i class="bi bi-truck"></i> Suppliers
            </a>

            <a href="#" class="nav-link" data-page="purchase-orders">
                <i class="bi bi-cart-plus"></i> Purchase Orders
            </a>

            <a href="#" class="nav-link" data-page="sales">
                <i class="bi bi-receipt"></i> Sales
            </a>

            <a href="#" class="nav-link" data-page="transfers">
                <i class="bi bi-arrow-left-right"></i> Transfers
            </a>

            <div class="menu-label">ANALYTICS</div>

            <a href="#" class="nav-link" data-page="reports">
                <i class="bi bi-bar-chart"></i> Reports
            </a>

        </nav>

        <div class="sidebar-bottom">
            <div class="profile-avatar" id="profileAvatar">A</div>
            <div class="profile-info">
                <strong id="profileName">Administrator</strong>
                <small id="profileRole">Admin</small>
            </div>
            <button class="logout-button" id="logoutBtn" title="Logout">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </div>

    </aside>

    <main class="main-content">

        <header class="topbar">

            <button class="mobile-menu" id="mobileMenu">
                <i class="bi bi-list"></i>
            </button>

            <div>
                <h5 id="pageTitle">Dashboard</h5>
                <small id="pageSubtitle">Welcome to StockMaster</small>
            </div>

            <div class="topbar-right">
                <span class="system-status">
                    <span class="status-dot"></span> System Online
                </span>
                <div class="topbar-avatar">A</div>
            </div>

        </header>

        <section class="page-container" id="pageContent">

            <div class="loading-state">
                <div class="spinner-border text-primary"></div>
                <p>Loading StockMaster...</p>
            </div>

        </section>

    </main>

</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/products.js"></script>
<script src="js/categories.js"></script>
<script src="js/operations.js"></script>
<script src="js/app.js"></script>

</body>
</html>
